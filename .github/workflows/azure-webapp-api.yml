name: Build and deploy API to Azure Web App

on:
  push:
    branches:
      - master
    paths:
      - 'src/BKeeper.Api/**'
      - 'src/BKeeper.Application/**'
      - 'src/BKeeper.Domain/**'
      - 'src/BKeeper.Infrastructure/**'
      - 'BKeeper.slnx'
      - '.github/workflows/azure-webapp-api.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: bkeeper-api-gqfub3ebf5gyeshr
  AZURE_WEBAPP_PACKAGE_PATH: publish
  DOTNET_VERSION: '10.0.x'
  API_PROJECT: src/BKeeper.Api/BKeeper.Api.csproj

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.API_PROJECT }}

      - name: Build
        run: dotnet build ${{ env.API_PROJECT }} -c Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.API_PROJECT }} -c Release -o ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} --no-build

      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: bkeeper-api
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      contents: read
    steps:
      - name: Download published app
        uses: actions/download-artifact@v4
        with:
          name: bkeeper-api
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
